<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebras | Live</title>
  <meta name="description" content="Live speech-to-text session for real-time communication." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar">
  <div class="container nav-container">
    <div class="logo"><a href="/dashboard">Nebras</a></div>

    <nav class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/upload">Upload</a>
      <a href="/sessions">Sessions</a>
      <button id="logoutBtn" class="btn-outline" type="button">Logout</button>
    </nav>
  </div>
</header>

<main class="tool-page">
  <div class="container">

    <section class="page-header">
      <h1>Live Session</h1>
      <p class="muted">
        Convert spoken speech into written text in real time.
      </p>
    </section>

    <section class="tool-panel">

      <div class="status-bar">
        <span class="status-label">Status:</span>
        <span id="statusPill" class="status-pill">Ready</span>
      </div>

      <div class="controls">
        <button id="startRecBtn" class="btn-primary" type="button">Start Recording</button>
        <button id="stopRecBtn" class="btn-outline" type="button" disabled>Stop Recording</button>
        <button id="clearAudioBtn" class="btn-outline" type="button">Clear Audio</button>
        <span class="muted" id="recTimer">00:00</span>
      </div>

      <div class="controls">
        <label class="sr-only" for="translateLang">Translate To</label>
        <select id="translateLang" class="select">
          <option value="en">Translate to English</option>
          <option value="ar">Translate to Arabic</option>
          <option value="fr">Translate to French</option>
          <option value="es">Translate to Spanish</option>
          <option value="de">Translate to German</option>
          <option value="tr">Translate to Turkish</option>
        </select>

        <button id="translateBtn" class="btn-outline" type="button">Translate Text</button>
        <button id="clearTranslateBtn" class="btn-outline" type="button" hidden>Hide Translation</button>
      </div>

      <div class="dual-editor-wrap">
        <div class="transcript-box dual-box">
          <label class="transcript-label" for="editor">Original Text</label>
          <div id="editor" class="rich-editor" contenteditable="true" spellcheck="false"></div>
        </div>

        <div class="transcript-box dual-box" id="translateBox" hidden>
          <label class="transcript-label" for="translatedEditor">Translated Text</label>
          <div id="translatedEditor" class="rich-editor" contenteditable="false"></div>
        </div>
      </div>

      <div class="controls">
        <span class="muted" id="wordCount">Words: 0</span>
        <span class="muted" id="charCount">Chars: 0</span>
      </div>

      <div class="actions">
        <input id="sessionTitle" class="input" type="text" placeholder="Session title (optional)" />
        <button id="saveSessionBtn" class="btn-primary" type="button">Save Session</button>
      </div>

      <div id="messageBox" class="message-box" role="status" aria-live="polite"></div>
      <div id="audioInfo" class="muted"></div>

    </section>
  </div>
</main>

<footer class="footer">
  <div class="container footer-content">
    <p>© 2026 Nebras. All rights reserved.</p>
  </div>
</footer>

<script src="js/main.js" defer></script>
<script src="js/live.js" defer></script>

</body>
</html>
